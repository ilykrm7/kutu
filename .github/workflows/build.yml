name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/Kutu.Core.Tests/Kutu.Core.Tests.csproj -c Release -f net8.0 --nologo

  publish:
    name: win-x64 single file
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/Kutu.Core.Tests/Kutu.Core.Tests.csproj -c Release -f net48 --nologo

      - name: Build shell extension
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path src/Kutu.App/shell | Out-Null
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($vs) {
            $builtDll = "src\Kutu.App\shell\KutuShell.ci.dll"
            $builtHost = "src\Kutu.App\shell\KutuShell.ci.exe"
            cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /LD /O2 /EHsc /utf-8 /Fo:src\Kutu.App\shell\KutuShell.obj src\Kutu.Shell\KutuShell.cpp /link /OUT:$builtDll ole32.lib uuid.lib shell32.lib shlwapi.lib & cl /nologo /O2 /MT /EHsc /utf-8 /Fo:src\Kutu.App\shell\KutuShellHost.obj /Fe:$builtHost src\Kutu.Shell\KutuShellHost.cpp /link /SUBSYSTEM:WINDOWS user32.lib kernel32.lib & exit /b 0"
            if ((Test-Path $builtDll) -and ((Get-Item $builtDll).Length -gt 0)) {
              Move-Item -Force $builtDll src\Kutu.App\shell\KutuShell.dll
              Write-Host "Using the MSVC shell DLL"
            } else {
              Write-Host "cl did not produce a DLL; the committed KutuShell.dll stays in the package"
              if (Test-Path $builtDll) { Remove-Item $builtDll -Force }
            }
            if ((Test-Path $builtHost) -and ((Get-Item $builtHost).Length -gt 0)) {
              Move-Item -Force $builtHost src\Kutu.App\shell\KutuShell.exe
              Write-Host "Using the MSVC shell host"
            } elseif (Test-Path $builtHost) {
              Remove-Item $builtHost -Force
            }
          }
          Remove-Item src\Kutu.App\shell\*.obj, src\Kutu.App\shell\*.exp, src\Kutu.App\shell\*.lib, src\Kutu.App\shell\*.pdb -ErrorAction SilentlyContinue
          if (-not (Test-Path src/Kutu.App/shell/KutuShell.dll)) { throw "KutuShell.dll was not produced" }
          if (-not (Test-Path src/Kutu.App/shell/KutuShell.exe)) { throw "KutuShell.exe was not produced" }

      - name: Publish Kutu.exe
        shell: pwsh
        run: >
          dotnet publish src/Kutu.App/Kutu.App.csproj
          -c Release
          -p:DebugType=none
          -p:DebugSymbols=false
          -o artifacts

      - name: Print size
        shell: pwsh
        run: |
          Get-Item artifacts/Kutu.exe | ForEach-Object { "{0}`t{1}" -f $_.Name, $_.Length }
          $hash = (Get-FileHash -Algorithm SHA256 artifacts/Kutu.exe).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'artifacts/Kutu.exe.sha256'), "$hash  Kutu.exe`n")
          Get-Content artifacts/Kutu.exe.sha256

      - name: Allow unsigned sparse packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name AllowAllTrustedApps -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null

      - name: Defender scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path $mp)) { throw "MpCmdRun.exe was not found at $mp" }
          $service = Get-Service WinDefend -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne 'Running') { Start-Service WinDefend }
          $updated = $false
          foreach ($try in 1..3) {
            & $mp -SignatureUpdate
            Write-Host "signature update exit $LASTEXITCODE"
            if ($LASTEXITCODE -eq 0) { $updated = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $updated) { throw 'Defender signature update failed' }
          New-Item -ItemType Directory -Force -Path artifacts/ship | Out-Null
          Copy-Item artifacts/Kutu.exe artifacts/ship/Kutu.exe -Force
          Copy-Item artifacts/Kutu.exe.sha256 artifacts/ship/Kutu.exe.sha256 -Force
          $exe = (Resolve-Path 'artifacts\ship\Kutu.exe').Path
          function Test-KutuScan($path) {
            & $mp -Scan -ScanType 3 -File $path -DisableRemediation
            Write-Host "scan exit $LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) { throw "Defender scan flagged $path (exit $LASTEXITCODE)" }
          }
          function Get-KutuThreats {
            $json = & powershell.exe -NoProfile -NonInteractive -Command "Get-MpThreatDetection | ConvertTo-Json -Depth 5 -Compress"
            if ($LASTEXITCODE -ne 0) { throw 'Get-MpThreatDetection failed' }
            if ([string]::IsNullOrWhiteSpace($json) -or $json -eq 'null') { return @() }
            return @($json | ConvertFrom-Json)
          }
          Test-KutuScan $exe
          $log = Join-Path $env:APPDATA 'Kutu\kutu.log'
          if (Test-Path $log) { Remove-Item $log -Force }
          Get-Process -Name Kutu -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          do {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) {
              $body = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
              $threats = Get-KutuThreats | ConvertTo-Json -Depth 5 -Compress
              throw "Kutu.exe exited during the Defender watch with $($proc.ExitCode).`n$body`n$threats"
            }
          } while ((Get-Date) -lt $deadline)
          if (Test-Path $log) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Kutu.exe wrote kutu.log during the Defender watch:`n$(Get-Content $log -Raw)"
          }
          Stop-Process -Id $proc.Id -Force
          Start-Sleep -Seconds 2
          Test-KutuScan $exe
          $hits = @(Get-KutuThreats | Where-Object {
            $blob = ($_ | ConvertTo-Json -Depth 5 -Compress)
            $blob -match 'Kutu|Bearfoos'
          })
          if ($hits.Count -gt 0) {
            throw "Defender flagged Kutu:`n$($hits | ConvertTo-Json -Depth 5)"
          }
          $shell = Join-Path $env:APPDATA 'Kutu\shell\1.1.0'
          foreach ($name in 'KutuShell.dll','KutuShell.exe') {
            $path = Join-Path $shell $name
            if (Test-Path $path) { Test-KutuScan $path }
          }
          Write-Host 'Defender: clean'

      - name: Smoke start
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $log = Join-Path $env:APPDATA 'Kutu\kutu.log'
          function Stop-Kutu {
            Get-Process -Name Kutu -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -like '*kutu-shell*' } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 1
          }
          function Assert-Started($path, $seconds) {
            Stop-Kutu
            if (Test-Path $log) { Remove-Item $log -Force }
            $proc = Start-Process -FilePath $path -PassThru
            $deadline = (Get-Date).AddSeconds($seconds)
            do {
              Start-Sleep -Seconds 2
              if ($proc.HasExited) {
                $body = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
                throw "$path exited with $($proc.ExitCode).`n$body"
              }
            } while ((Get-Date) -lt $deadline)
            if (Test-Path $log) {
              $body = Get-Content $log -Raw
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "$path wrote kutu.log:`n$body"
            }
            if (-not (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue)) {
              throw "$path is not running"
            }
            Stop-Process -Id $proc.Id -Force
            Stop-Kutu
            Write-Host "started $path"
          }
          New-Item -ItemType Directory -Force -Path artifacts/ship | Out-Null
          Copy-Item artifacts/Kutu.exe artifacts/ship/Kutu.exe -Force
          Copy-Item artifacts/Kutu.exe.sha256 artifacts/ship/Kutu.exe.sha256 -Force
          Assert-Started (Resolve-Path 'artifacts\ship\Kutu.exe') 20

      - name: Context menu command
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Stop-Kutu {
            Get-Process -Name Kutu -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -like '*kutu-shell*' } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 1
          }
          Stop-Kutu
          $log = Join-Path $env:APPDATA 'Kutu\kutu.log'
          if (Test-Path $log) { Remove-Item $log -Force }
          $lite = (Resolve-Path 'artifacts\ship\Kutu.exe').Path
          $proc = Start-Process -FilePath $lite -PassThru
          $extensions = '.png','.jpg','.jpeg','.jfif','.webp','.bmp','.gif','.tif','.tiff','.ico','.heic','.heif'
          $verbs = @(
            @{ Name = '01jpeg'; Format = 'jpeg'; Title = 'JPEG' },
            @{ Name = '02png'; Format = 'png'; Title = 'PNG' },
            @{ Name = '03webp'; Format = 'webp'; Title = 'WebP' },
            @{ Name = '04ico'; Format = 'ico'; Title = 'ICO' },
            @{ Name = '05pdf'; Format = 'pdf'; Title = 'PDF' },
            @{ Name = '06bmp'; Format = 'bmp'; Title = 'BMP' }
          )
          $settings = Join-Path $env:APPDATA 'Kutu\settings.json'
          $store = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\CommandStore\shell\Kutu.ToJpeg'
          $deadline = (Get-Date).AddSeconds(45)
          $ready = $false
          do {
            Start-Sleep -Seconds 1
            if ($proc.HasExited) { break }
            $ready = $true
            foreach ($ext in $extensions) {
              $base = "HKCU:\Software\Classes\SystemFileAssociations\$ext\shell\Kutu"
              if (-not (Test-Path $base)) { $ready = $false; break }
              $item = Get-Item $base
              $subs = $item.GetValue('SubCommands')
              # Explorer resolves a non-empty SubCommands list only in HKLM CommandStore.
              # An empty string makes it enumerate this key's shell subkeys instead.
              if ($item.GetValue('MUIVerb') -ne 'Kutu ile dönüştür' -or $null -eq $subs -or "$subs" -ne '') { $ready = $false; break }
              if (Test-Path "$base\command") { $ready = $false; break }
              foreach ($verb in $verbs) {
                if (-not (Test-Path "$base\shell\$($verb.Name)\command")) { $ready = $false; break }
              }
              if (-not $ready) { break }
            }
            if ($ready -and (Test-Path $store)) { $ready = $false }
            if ($ready -and (-not (Test-Path $settings) -or (Get-Content $settings -Raw) -notmatch '"contextMenuRegistered"\s*:\s*true')) { $ready = $false }
          } while (-not $ready -and (Get-Date) -lt $deadline)
          if (-not $ready) {
            $state = if ($proc.HasExited) { "exited $($proc.ExitCode)" } else { 'still running' }
            $body = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
            $json = if (Test-Path $settings) { Get-Content $settings -Raw } else { '(no settings)' }
            $png = Test-Path 'HKCU:\Software\Classes\SystemFileAssociations\.png\shell\Kutu'
            throw "nested context menu was not registered for Kutu.exe ($state, png=$png).`n$json`n$body"
          }
          foreach ($ext in $extensions) {
            $base = "HKCU:\Software\Classes\SystemFileAssociations\$ext\shell\Kutu"
            $item = Get-Item $base
            $subs = $item.GetValue('SubCommands')
            if ($null -eq $subs -or "$subs" -ne '') { throw "$ext SubCommands must be empty so Explorer lists child verbs, got '$subs'" }
            if (Test-Path "$base\command") { throw "$ext parent must not have a command key" }
            $icon = [string]$item.GetValue('Icon')
            if ($icon -notlike "*$lite*") { throw "$ext icon is $icon" }
            $children = @(Get-ChildItem "$base\shell")
            if ($children.Count -ne $verbs.Count) { throw "$ext cascade has $($children.Count) verbs" }
            foreach ($verb in $verbs) {
              $key = Get-Item "$base\shell\$($verb.Name)"
              if ($key.GetValue('MUIVerb') -ne $verb.Title) { throw "$ext $($verb.Name) title is $($key.GetValue('MUIVerb'))" }
              $line = [string](Get-Item "$base\shell\$($verb.Name)\command").GetValue('')
              $expected = "`"$lite`" --convert-to $($verb.Format) `"%1`""
              if ($line -ne $expected) { throw "$ext $($verb.Name) command:`n$line`nexpected:`n$expected" }
            }
          }
          if (Test-Path $store) { throw 'HKCU CommandStore is ignored by Explorer SubCommands and must not be registered' }
          $json = Get-Content $settings -Raw
          if ($json -notmatch '"contextMenuRegistered"\s*:\s*true') { throw "settings flag:`n$json" }
          if ($proc.HasExited) { throw "Kutu exited during menu registration with $($proc.ExitCode)" }
          if (Test-Path $log) { throw "menu registration wrote kutu.log:`n$(Get-Content $log -Raw)" }
          $shell = Join-Path $env:APPDATA 'Kutu\shell\1.1.0'
          $pkgDeadline = (Get-Date).AddSeconds(60)
          $pkg = $null
          do {
            $pkg = Get-AppxPackage -Name 'KerimEksi.Kutu.Shell' -ErrorAction SilentlyContinue
            if ($pkg -and $pkg.InstallLocation) { break }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $pkgDeadline)
          if (-not $pkg) {
            $stampPath = Join-Path $shell 'kutu.sparse'
            $shellLog = Join-Path $shell 'kutu-shell.log'
            $stampText = if (Test-Path $stampPath) { Get-Content $stampPath -Raw } else { '(no stamp)' }
            $logText = if (Test-Path $shellLog) { Get-Content $shellLog -Raw } else { '(no shell log)' }
            $listing = if (Test-Path $shell) { ((Get-ChildItem $shell -Force).Name -join ', ') } else { '(no shell dir)' }
            throw "Win11 sparse package was not registered.`n$stampText`n$logText`n$listing"
          }
          $location = [IO.Path]::GetFullPath($pkg.InstallLocation).TrimEnd('\','/')
          $expected = [IO.Path]::GetFullPath($shell).TrimEnd('\','/')
          if ($location -ine $expected) { throw "sparse package location is $location, expected $expected" }
          foreach ($name in 'KutuShell.dll','KutuShell.exe','Square44x44Logo.png','Square150x150Logo.png','StoreLogo.png','kutu.path','kutu-shell.ps1','kutu.sparse','AppxManifest.xml') {
            if (-not (Test-Path (Join-Path $shell $name))) { throw "shell folder is missing $name" }
          }
          $pathText = (Get-Content (Join-Path $shell 'kutu.path') -Raw).Trim()
          if ($pathText -ne $lite) { throw "kutu.path is $pathText" }
          $manifest = Get-Content (Join-Path $shell 'AppxManifest.xml') -Raw
          if ($manifest -notmatch 'Executable="KutuShell.exe"') { throw 'manifest executable is not the shell host' }
          if ($manifest -notmatch 'Path="KutuShell.dll"') { throw 'manifest is missing KutuShell.dll' }
          if ($manifest -notmatch 'KutuConvert') { throw 'manifest is missing the convert verb' }
          $beside = @(Get-ChildItem (Split-Path $lite) -Force | Where-Object { $_.Name -notin @('Kutu.exe','Kutu.exe.sha256') })
          if ($beside.Count -gt 0) { throw "files beside Kutu.exe: $($beside.Name -join ', ')" }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class KutuComProbe {
            [DllImport("ole32.dll")]
            public static extern int CoCreateInstance(ref Guid clsid, IntPtr outer, uint context, ref Guid iid, out IntPtr instance);
            [DllImport("ole32.dll")]
            public static extern int CoInitializeEx(IntPtr reserved, uint coinit);
          }
          '@
          [KutuComProbe]::CoInitializeEx([IntPtr]::Zero, 2) | Out-Null
          $clsid = [guid]'B6E1A2C4-7D33-4F1A-9C58-2E6A4B8D1F70'
          $iid = [guid]'00000000-0000-0000-C000-000000000046'
          $instance = [IntPtr]::Zero
          $hr = [KutuComProbe]::CoCreateInstance([ref]$clsid, [IntPtr]::Zero, 23, [ref]$iid, [ref]$instance)
          if ($hr -ne 0 -or $instance -eq [IntPtr]::Zero) { throw ("modern context menu COM activation failed: 0x{0:X8}" -f ($hr -band 0xffffffff)) }
          [Runtime.InteropServices.Marshal]::Release($instance) | Out-Null
          Write-Host "modern context menu registered at $location"
          $dir = Join-Path $env:TEMP ("kutu-menu-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $dir | Out-Null
          $png = [Convert]::FromBase64String('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==')
          $source = Join-Path $dir 'in.png'
          $sourceB = Join-Path $dir 'b.png'
          [IO.File]::WriteAllBytes($source, $png)
          [IO.File]::WriteAllBytes($sourceB, $png)
          $out = Join-Path $dir 'in.jpg'
          $outB = Join-Path $dir 'b.jpg'
          # The main instance is still running. Explorer starts one process per file;
          # both must convert and exit without taking the single-instance mutex.
          if ($proc.HasExited) { throw 'Kutu exited before the convert-to check' }
          $convert = Start-Process -FilePath $lite -ArgumentList @('--convert-to','jpeg',$source) -PassThru
          $convertB = Start-Process -FilePath $lite -ArgumentList @('--convert-to','jpeg',$sourceB) -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 1
            if ((Test-Path $out) -and (Test-Path $outB)) { break }
          } while ((Get-Date) -lt $deadline)
          $exitDeadline = (Get-Date).AddSeconds(8)
          while ((-not $convert.HasExited -or -not $convertB.HasExited) -and (Get-Date) -lt $exitDeadline) { Start-Sleep -Milliseconds 200 }
          if (-not $convert.HasExited -or -not $convertB.HasExited) { throw 'convert-to stayed running instead of exiting headless' }
          if ($proc.HasExited) { throw 'headless convert-to took down the already running instance' }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Stop-Kutu
          if (-not (Test-Path $out) -or -not (Test-Path $outB)) { throw "context menu command did not write both outputs" }
          $bytes = [IO.File]::ReadAllBytes($out)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0xFF -or $bytes[1] -ne 0xD8) { throw 'context menu output is not a jpeg' }
          Remove-Item $out -Force
          $alone = Start-Process -FilePath $lite -ArgumentList @('--convert-to','jpeg',$source) -PassThru
          $aloneDeadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 200
            if ($alone.HasExited -and (Test-Path $out)) { break }
          } while ((Get-Date) -lt $aloneDeadline)
          if (-not $alone.HasExited) { throw 'convert-to with Kutu closed opened a window instead of exiting' }
          Get-Process -Name Kutu -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $out)) { throw 'convert-to with Kutu closed did not write the jpeg' }
          Write-Host "context menu command wrote $($bytes.Length) bytes"

      - name: Assert single-file artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @(Get-ChildItem artifacts/ship -Force | Sort-Object Name)
          Write-Host 'artifact files:'
          $names | ForEach-Object { "{0}`t{1}" -f $_.Name, $_.Length }
          $expected = @('Kutu.exe', 'Kutu.exe.sha256')
          $actual = @($names | ForEach-Object { $_.Name })
          if (($actual -join ',') -ne ($expected -join ',')) {
            throw "ship folder must contain only Kutu.exe and Kutu.exe.sha256: $($actual -join ', ')"
          }
          foreach ($name in 'KutuShell.dll','KutuShell.exe','Square44x44Logo.png','Square150x150Logo.png','kutu-shell.ps1','kutu.sparse','kutu.sparse.txt','kutu.path','AppxManifest.xml','StoreLogo.png') {
            if (Test-Path (Join-Path artifacts/ship $name)) { throw "$name was published beside Kutu.exe" }
          }

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kutu-win-x64
          path: |
            artifacts/ship/Kutu.exe
            artifacts/ship/Kutu.exe.sha256
          if-no-files-found: error

      - name: Attach exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Kutu.exe
            artifacts/Kutu.exe.sha256
          fail_on_unmatched_files: true
