name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/Kutu.Core.Tests/Kutu.Core.Tests.csproj -c Release --nologo

  publish:
    name: win-x64 single file
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/Kutu.Core.Tests/Kutu.Core.Tests.csproj -c Release --nologo

      - name: Publish Kutu.exe
        shell: pwsh
        run: >
          dotnet publish src/Kutu.App/Kutu.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeAllContentForSelfExtract=true
          -p:DebugType=embedded
          -o artifacts

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kutu-win-x64
          path: artifacts/Kutu.exe
          if-no-files-found: error

      - name: Attach exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Kutu.exe
          fail_on_unmatched_files: true
