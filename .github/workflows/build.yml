name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/Kutu.Core.Tests/Kutu.Core.Tests.csproj -c Release --nologo

  publish:
    name: win-x64 single file
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/Kutu.Core.Tests/Kutu.Core.Tests.csproj -c Release --nologo

      - name: Build shell extension
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path src/Kutu.App/shell | Out-Null
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($vs) {
            $built = "src\Kutu.App\shell\KutuShell.ci.dll"
            cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /LD /O2 /EHsc /utf-8 src\Kutu.Shell\KutuShell.cpp /link /OUT:$built ole32.lib uuid.lib shell32.lib shlwapi.lib & exit /b 0"
            if ((Test-Path $built) -and ((Get-Item $built).Length -gt 0)) {
              Move-Item -Force $built src\Kutu.App\shell\KutuShell.dll
              Write-Host "Using the MSVC shell DLL"
            } else {
              Write-Host "cl did not produce a DLL; the committed KutuShell.dll stays in the package"
              if (Test-Path $built) { Remove-Item $built -Force }
            }
          }
          if (-not (Test-Path src/Kutu.App/shell/KutuShell.dll)) { throw "KutuShell.dll was not produced" }

      - name: Publish Kutu.exe
        shell: pwsh
        run: >
          dotnet publish src/Kutu.App/Kutu.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:PublishReadyToRun=false
          -o artifacts/full

      - name: Publish Kutu-lite.exe
        shell: pwsh
        run: >
          dotnet publish src/Kutu.App/Kutu.App.csproj
          -c Release
          -r win-x64
          -p:SelfContained=false
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=false
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:PublishReadyToRun=false
          -o artifacts/lite

      - name: Rename lite exe and print sizes
        shell: pwsh
        run: |
          Move-Item -Force artifacts/lite/Kutu.exe artifacts/lite/Kutu-lite.exe
          Get-Item artifacts/full/Kutu.exe, artifacts/lite/Kutu-lite.exe | ForEach-Object { "{0}`t{1}" -f $_.Name, $_.Length }

      - name: Smoke start
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $log = Join-Path $env:APPDATA 'Kutu\kutu.log'
          function Stop-Kutu {
            Get-Process -Name Kutu,Kutu-lite -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
          }
          function Assert-Started($path, $seconds) {
            Stop-Kutu
            if (Test-Path $log) { Remove-Item $log -Force }
            $proc = Start-Process -FilePath $path -PassThru
            $deadline = (Get-Date).AddSeconds($seconds)
            do {
              Start-Sleep -Seconds 2
              if ($proc.HasExited) {
                $body = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
                throw "$path exited with $($proc.ExitCode).`n$body"
              }
            } while ((Get-Date) -lt $deadline)
            if (Test-Path $log) {
              $body = Get-Content $log -Raw
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "$path wrote kutu.log:`n$body"
            }
            if (-not (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue)) {
              throw "$path is not running"
            }
            Stop-Process -Id $proc.Id -Force
            Stop-Kutu
            Write-Host "started $path"
          }
          Assert-Started (Resolve-Path 'artifacts\lite\Kutu-lite.exe') 8
          Assert-Started (Resolve-Path 'artifacts\full\Kutu.exe') 25

      - name: Context menu command
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Stop-Kutu {
            Get-Process -Name Kutu,Kutu-lite -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
          }
          Stop-Kutu
          $log = Join-Path $env:APPDATA 'Kutu\kutu.log'
          if (Test-Path $log) { Remove-Item $log -Force }
          $lite = (Resolve-Path 'artifacts\lite\Kutu-lite.exe').Path
          $proc = Start-Process -FilePath $lite -PassThru
          $extensions = '.png','.jpg','.jpeg','.jfif','.webp','.bmp','.gif','.tif','.tiff','.ico','.heic','.heif'
          $verbs = @(
            @{ Name = '01jpeg'; Format = 'jpeg'; Title = 'JPEG' },
            @{ Name = '02png'; Format = 'png'; Title = 'PNG' },
            @{ Name = '03webp'; Format = 'webp'; Title = 'WebP' },
            @{ Name = '04ico'; Format = 'ico'; Title = 'ICO' },
            @{ Name = '05pdf'; Format = 'pdf'; Title = 'PDF' },
            @{ Name = '06bmp'; Format = 'bmp'; Title = 'BMP' }
          )
          $settings = Join-Path $env:APPDATA 'Kutu\settings.json'
          $store = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\CommandStore\shell\Kutu.ToJpeg'
          $deadline = (Get-Date).AddSeconds(20)
          $ready = $false
          do {
            Start-Sleep -Seconds 1
            $ready = $true
            foreach ($ext in $extensions) {
              $base = "HKCU:\Software\Classes\SystemFileAssociations\$ext\shell\Kutu"
              if (-not (Test-Path $base)) { $ready = $false; break }
              $item = Get-Item $base
              $subs = $item.GetValue('SubCommands')
              # Explorer resolves a non-empty SubCommands list only in HKLM CommandStore.
              # An empty string makes it enumerate this key's shell subkeys instead.
              if ($item.GetValue('MUIVerb') -ne 'Kutu ile dönüştür' -or $null -eq $subs -or "$subs" -ne '') { $ready = $false; break }
              if (Test-Path "$base\command") { $ready = $false; break }
              foreach ($verb in $verbs) {
                if (-not (Test-Path "$base\shell\$($verb.Name)\command")) { $ready = $false; break }
              }
              if (-not $ready) { break }
            }
            if ($ready -and (Test-Path $store)) { $ready = $false }
            if ($ready -and (-not (Test-Path $settings) -or (Get-Content $settings -Raw) -notmatch '"contextMenuRegistered"\s*:\s*true')) { $ready = $false }
          } while (-not $ready -and (Get-Date) -lt $deadline)
          if (-not $ready) { throw 'nested context menu was not registered for Kutu-lite.exe' }
          foreach ($ext in $extensions) {
            $base = "HKCU:\Software\Classes\SystemFileAssociations\$ext\shell\Kutu"
            $item = Get-Item $base
            $subs = $item.GetValue('SubCommands')
            if ($null -eq $subs -or "$subs" -ne '') { throw "$ext SubCommands must be empty so Explorer lists child verbs, got '$subs'" }
            if (Test-Path "$base\command") { throw "$ext parent must not have a command key" }
            $icon = [string]$item.GetValue('Icon')
            if ($icon -notlike "*$lite*") { throw "$ext icon is $icon" }
            $children = @(Get-ChildItem "$base\shell")
            if ($children.Count -ne $verbs.Count) { throw "$ext cascade has $($children.Count) verbs" }
            foreach ($verb in $verbs) {
              $key = Get-Item "$base\shell\$($verb.Name)"
              if ($key.GetValue('MUIVerb') -ne $verb.Title) { throw "$ext $($verb.Name) title is $($key.GetValue('MUIVerb'))" }
              $line = [string](Get-Item "$base\shell\$($verb.Name)\command").GetValue('')
              $expected = "`"$lite`" --convert-to $($verb.Format) `"%1`""
              if ($line -ne $expected) { throw "$ext $($verb.Name) command:`n$line`nexpected:`n$expected" }
            }
          }
          if (Test-Path $store) { throw 'HKCU CommandStore is ignored by Explorer SubCommands and must not be registered' }
          $json = Get-Content $settings -Raw
          if ($json -notmatch '"contextMenuRegistered"\s*:\s*true') { throw "settings flag:`n$json" }
          if ($proc.HasExited) { throw "Kutu-lite exited during menu registration with $($proc.ExitCode)" }
          if (Test-Path $log) { throw "menu registration wrote kutu.log:`n$(Get-Content $log -Raw)" }
          $dir = Join-Path $env:TEMP ("kutu-menu-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $dir | Out-Null
          $png = [Convert]::FromBase64String('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==')
          $source = Join-Path $dir 'in.png'
          $sourceB = Join-Path $dir 'b.png'
          [IO.File]::WriteAllBytes($source, $png)
          [IO.File]::WriteAllBytes($sourceB, $png)
          $out = Join-Path $dir 'in.jpg'
          $outB = Join-Path $dir 'b.jpg'
          # The main instance is still running. Explorer starts one process per file;
          # both must convert and exit without taking the single-instance mutex.
          if ($proc.HasExited) { throw 'Kutu-lite exited before the convert-to check' }
          $convert = Start-Process -FilePath $lite -ArgumentList @('--convert-to','jpeg',$source) -PassThru
          $convertB = Start-Process -FilePath $lite -ArgumentList @('--convert-to','jpeg',$sourceB) -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 1
            if ((Test-Path $out) -and (Test-Path $outB)) { break }
          } while ((Get-Date) -lt $deadline)
          $exitDeadline = (Get-Date).AddSeconds(8)
          while ((-not $convert.HasExited -or -not $convertB.HasExited) -and (Get-Date) -lt $exitDeadline) { Start-Sleep -Milliseconds 200 }
          if (-not $convert.HasExited -or -not $convertB.HasExited) { throw 'convert-to stayed running instead of exiting headless' }
          if ($proc.HasExited) { throw 'headless convert-to took down the already running instance' }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Stop-Kutu
          if (-not (Test-Path $out) -or -not (Test-Path $outB)) { throw "context menu command did not write both outputs" }
          $bytes = [IO.File]::ReadAllBytes($out)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0xFF -or $bytes[1] -ne 0xD8) { throw 'context menu output is not a jpeg' }
          Remove-Item $out -Force
          $alone = Start-Process -FilePath $lite -ArgumentList @('--convert-to','jpeg',$source) -PassThru
          $aloneDeadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 200
            if ($alone.HasExited -and (Test-Path $out)) { break }
          } while ((Get-Date) -lt $aloneDeadline)
          if (-not $alone.HasExited) { throw 'convert-to with Kutu closed opened a window instead of exiting' }
          Get-Process -Name Kutu,Kutu-lite -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $out)) { throw 'convert-to with Kutu closed did not write the jpeg' }
          Write-Host "context menu command wrote $($bytes.Length) bytes"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kutu-win-x64
          path: |
            artifacts/full/Kutu.exe
            artifacts/lite/Kutu-lite.exe
          if-no-files-found: error

      - name: Attach exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/full/Kutu.exe
            artifacts/lite/Kutu-lite.exe
          fail_on_unmatched_files: true
